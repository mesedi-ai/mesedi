# golangci-lint v2 config for the Mesedi backend.
#
# Static analysis posture:
#   - SA* family of staticcheck is the only deploy gate (correctness).
#   - ST1*/QF*/S1* style nudges are off; they fail on legitimate
#     non-canonical code without catching bugs.
#   - errcheck on the canonical close/rollback idioms is allowlisted.
#   - `unused` is disabled because scaffolding constants (kept for
#     pending implementation) would flag clean otherwise.
#
# Run via the stress-test harness, or manually:
#     golangci-lint run ./...

version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    # - unused      # disabled: see timeBudgetThresholdMs and similar
    #                 scaffolding constants kept for pending features.

  settings:
    staticcheck:
      # SA* only. ST1005 (error string punctuation), ST1000 (package
      # comment), QF (quick-fix), S1 (simplification) are style, not
      # correctness, and fire on legitimate non-canonical code.
      checks:
        - "SA*"

  exclusions:
    warn-unused: false

    paths:
      - internal/dashboard/ui      # embedded dashboard HTML/CSS, not Go
      - vendor

    rules:
      # The canonical Go idiom: defer x.Close() without checking the
      # return value. Wrapping every defer in `func() { _ = x.Close() }()`
      # adds noise without catching real bugs.
      - text: "Error return value of `.*\\.Close` is not checked"
        linters:
          - errcheck

      # Same for tx.Rollback (called after Commit as a defensive
      # no-op).
      - text: "Error return value of `.*\\.Rollback` is not checked"
        linters:
          - errcheck

      # fmt.Fprintf into a response writer inside an error-write path.
      # The connection is already failing; we can't usefully act on
      # the Fprintf error either.
      - text: "Error return value of `fmt\\.Fprintf` is not checked"
        linters:
          - errcheck

      # Test files are allowed to ignore errors from helper invocations.
      - path: _test\.go
        linters:
          - errcheck

      # gosec G115 (integer overflow conversion) is noisy on legitimate
      # ID handling and int conversions.
      - text: "G115"
        linters:
          - gosec

      # gosec on tests + sandboxes (intentionally relaxed).
      - path: _test\.go
        linters:
          - gosec
      - path: ^sandbox/
        linters:
          - gosec

      # G101 (hardcoded credentials) false-positives on Go constant
      # NAMES containing "key"/"password" even when the value is
      # non-secret descriptive text.
      - text: "G101"
        linters:
          - gosec

      # G104 (errors unhandled) overlaps with errcheck on close/rollback;
      # accept the same Go idiom under both linters' text headers.
      - text: "G104"
        linters:
          - gosec

      # G118 (Goroutine uses context.Background while request context
      # is available): the TouchAPIKey fire-and-forget goroutines in
      # admin.go / auth.go MUST use context.Background. r.Context() is
      # canceled when the response finishes, which would kill the
      # async write before it completes.
      - text: "G118"
        linters:
          - gosec

      # G705 (XSS via taint): fires on fmt.Fprintf into a response
      # writer and on w.Write([]byte(body)) where the bytes come from
      # either route-pattern-validated path values (executionID) or
      # JSON-encoded structs (handlers.go body). Audited safe; not a
      # real XSS surface.
      - text: "G705"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
