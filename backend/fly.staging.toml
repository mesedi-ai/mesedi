# Mesedi backend — Fly.io STAGING config.
#
# Companion to fly.toml (production). Same code, different app,
# different region (ord because iad was capacity-locked at spin-up
# time), test-mode Stripe keys.
#
# Purpose: safe surface for payment-smoke testing, migration
# rehearsal, stress tests, DR drills, and CE build proof-of-life.
# Full rationale in internal-extract/STAGING_ARCHITECTURE.md.
#
# Deploy: `flyctl deploy -a mesedi-api-staging --config fly.staging.toml`
# from backend/. GitHub Action wires this into merge-to-main.

app = "mesedi-api-staging"
primary_region = "ord"

[build]

[env]
  MESEDI_PORT = "8080"
  MESEDI_LOG_LEVEL = "info"
  MESEDI_DB_URL = "file:/data/mesedi.db?_pragma=journal_mode(WAL)&_pragma=foreign_keys(on)"
  # TBD: point at https://app-staging.mesedi.ai once dashboard
  # subdomain is set up. Meanwhile this fallback still lets webhook
  # deep-links work (they land on prod dashboard, which is harmless
  # for staging tests since customer sessions won't cross environments).
  MESEDI_DASHBOARD_URL = "https://app.mesedi.ai"

# Staging-specific volume; separate from prod's mesedi_data. Created
# via `flyctl volumes create mesedi_staging_data` (see
# internal-extract/STAGING_ARCHITECTURE.md build steps).
[[mounts]]
  source = "mesedi_staging_data"
  destination = "/data"

# Staging can freely stop when idle — same posture as prod's cost-
# saving mode, and staging traffic is low so cold starts are fine.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"
