# Fly.io auto-deploy on push to main.
#
# Replaces the manual `cd backend && flyctl deploy` step that's been
# the recurring miss every time a backend change ships. Triggers only
# when files under backend/ change; pushes touching only the SDKs,
# tools, or docs do not redeploy the API.
#
# Required repo secret:
#   FLY_API_TOKEN, an API token with deploy scope on the mesedi-api
#   app. Generate with `flyctl auth token` and paste into
#   GitHub repo Settings → Secrets and variables → Actions → New
#   repository secret.
#
# Rollback: if a deploy goes bad, `flyctl releases list -a mesedi-api`
# from any laptop shows the version history; `flyctl deploy -i
# registry.fly.io/mesedi-api:<previous-deployment-id>` ships the
# previous image back. Manual `flyctl deploy` from local also still
# works for emergencies.

name: Deploy backend to Fly

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:
    # Allow manual trigger from the Actions tab for unrelated reasons
    # (e.g., redeploy after a Fly outage without needing a code push).

concurrency:
  group: fly-deploy-mesedi-api
  cancel-in-progress: false
  # cancel-in-progress=false so two near-simultaneous merges to main
  # both deploy in order rather than the second one cancelling the
  # first mid-rollout. Fly's rolling strategy handles back-to-back
  # deploys correctly.

jobs:
  # Gate. Until 2026-08-20 this workflow deployed straight to production
  # on every push to main with nothing verifying the build first — a
  # broken commit reached prod and was only caught by a customer-facing
  # symptom. This job runs the backend suite and `deploy` needs it, so a
  # red test now blocks the rollout instead of following it.
  #
  # Deliberately duplicated from ci.yml rather than referenced: GitHub
  # Actions cannot express "wait for a job in another workflow" without
  # brittle status-polling, and the deploy gate is important enough to
  # keep self-contained. ci.yml still covers both SDKs on every push.
  test:
    name: go test (deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go build
        working-directory: backend
        run: go build ./...
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        run: go test ./...

  deploy:
    name: flyctl deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least-privilege GITHUB_TOKEN scope (CodeQL alert ). This
    # job only checks out the repo and runs `flyctl deploy`; it never
    # writes to the repo, creates comments, publishes packages, or
    # touches releases. contents:read is the bare minimum needed for
    # actions/checkout to read the working tree. Repositories created
    # before 2023 default to read-write, which CodeQL's
    # missing-workflow-permissions query flags as too broad.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        working-directory: ./backend
        run: flyctl deploy --remote-only --build-arg BUILD_GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A GREEN DEPLOY IS NOT EVIDENCE THAT THE RIGHT CODE IS RUNNING.
      #
      # Two separate incidents on 2026-09-04 had this shape: a workflow
      # reporting success while production served something else. In one,
      # an expired Fly token produced two weeks of successful-looking runs
      # that deployed nothing. In the other, the binary deployed fine but
      # its provenance stamp had silently stopped applying. Both were found
      # by a human reading a health endpoint by hand.
      #
      # So the deploy is not finished until the running service is asked
      # what it is and gives the right answer.
      #
      # Scope honestly: this catches a wrong or stale binary in production.
      # It does NOT catch a correct binary making a wrong claim — the two
      # subtlest bugs that day were found by reading code, and no amount of
      # health polling would have surfaced either.
      - name: Verify production is serving THIS commit
        run: |
          set -euo pipefail

          # Rolling deploys drain the old machine, so poll rather than
          # assume the new one is already answering.
          for attempt in $(seq 1 10); do
            LIVE_SHA="$(curl -fsS --max-time 10 https://api.mesedi.ai/health \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("git_sha",""))' \
              || echo "")"

            if [[ "$LIVE_SHA" == "${{ github.sha }}" ]]; then
              echo "Production is serving ${LIVE_SHA}."
              echo "- Verified live SHA: \`${LIVE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "attempt ${attempt}/10: live SHA is '${LIVE_SHA:-<unreachable>}', want ${{ github.sha }}"
            sleep 15
          done

          # Three diagnoses, because the remedies differ and a bare
          # "verification failed" sends someone looking in the wrong place.
          if [[ -z "${LIVE_SHA:-}" ]]; then
            echo "::error::/health did not answer. The deploy reported success but the service is unreachable or not returning JSON."
          elif [[ "${LIVE_SHA}" == "unknown" ]]; then
            echo "::error::Production reports git_sha 'unknown'. The binary built but the ldflags stamp did not apply. See backend/cmd/api/health_stamp_test.go."
          else
            echo "::error::Production is serving ${LIVE_SHA}, not ${{ github.sha }}. The deploy reported success without replacing the running binary. Check whether FLY_API_TOKEN is still valid — an expired token has produced this exact green-but-did-nothing failure before."
          fi
          exit 1
