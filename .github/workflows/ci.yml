# Test CI.
#
# Why this exists: before 2026-08-20 no workflow ran a single test.
# fly-deploy.yml shipped straight to production on every push to main
# with 562 Go tests and 228 Python tests gating nothing. The gap proved
# itself the day this was written — publishing the Python SDK surfaced a
# staleness test that had been failing silently (a phantom
# RetryableError entry in the Anthropic error map) because nothing ran
# it.
#
# Scope note: this workflow runs UNIT tests only. Anything that needs a
# live provider, a real API key, or money is excluded and stays a manual
# harness:
#   - backend/test/integration/  (pytest, needs a running backend)
#   - sdk-typescript *.integration.test.ts  (real Anthropic calls)
#   - Go files tagged `stripe_integration`  (excluded by default)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege: these jobs only read the tree and run tests.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref. Deploy
# gating lives in fly-deploy.yml, so cancelling here is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (go test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres 17 (Neon's version) for the store tests that set
    # MESEDI_TEST_POSTGRES_DSN. Until 2026-11-16 no Postgres path ran in CI,
    # and the account-closure cascade silently skipped a broken statement
    # on Postgres while SQLite failed (outside review findings E1, E15).
    # A throwaway container with trust auth: there is no password to leak.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mesedi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MESEDI_TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/mesedi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go build
        working-directory: backend
        run: go build ./...
      - name: go vet
        working-directory: backend
        run: go vet ./...
      # gofmt, because nothing else was running it.
      #
      # foundation-audit's B7 check declines to verify import grouping and
      # formatting on the stated grounds that both are "delegated to
      # language-native formatters (gofmt / isort / Prettier)", and tells
      # the reader to wire those up. Nobody had. This job ran go build,
      # go vet and go test and never gofmt, so the delegation pointed at a
      # job no automation performed — a check that correctly declines to
      # do something, and nobody else doing it.
      #
      # Found on 2026-09-04 because internal/webhooks/dispatcher.go had
      # been sitting unformatted through a green CI, noticed only because
      # gofmt was being run by hand on the side.
      #
      # Scoped to ./cmd and ./internal rather than ./... on purpose: a
      # repo-wide gate can be satisfied by reformatting generated or
      # vendored code, which turns a real failure into a diff nobody reads.
      # gofmt -l prints offending files and exits 0 either way, so the
      # emptiness test is what actually fails the build.
      - name: gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./attest)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w <file>"
            exit 1
          fi
      - name: go test
        working-directory: backend
        run: go test ./...
      # The attestation core is its own module, so the main module's
      # ./... does not descend into it. Without this step its tests
      # would run nowhere in CI.
      - name: go test (attest module)
        working-directory: backend/attest
        run: go test ./...
      # govulncheck, because Dependabot does not see Go itself.
      #
      # On 2026-11-16 Dependabot showed two Go alerts (OpenTelemetry), while
      # govulncheck found 15 known vulnerabilities the code actually
      # reaches: in the Go standard library (go.mod pinned 1.27.1; fixed in
      # 1.27.2 to 1.27.4), x/net and klauspost/compress. go-version-file
      # installs exactly the go.mod version, so nothing would ever have
      # moved it. govulncheck fails only on vulnerabilities the code calls,
      # so a finding here is a real one. Fix by raising the version it
      # names, not by skipping the step.
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: govulncheck (attest module)
        working-directory: backend/attest
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  sdk-python:
    name: sdk-python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Runs before the install because it needs nothing but the stdlib
      # and the checked-out tree, and a broken README should fail in
      # seconds rather than after a full dependency install. Both SDK
      # READMEs render as the PyPI and npm package descriptions, so an
      # import that does not exist is a customer-facing defect.
      - name: README API check
        run: python3 tools/check_readme_api.py
      # Docstrings and JSDoc render in IDE tooltips and on the package
      # pages, so they are customer-facing prose. Ordinary line comments
      # are not checked; see the script header for why.
      - name: Doc comment style
        run: python3 tools/check_doc_comment_style.py
      # pyproject.toml and mesedi/__init__.py both declare the version.
      # The release workflow only checks pyproject, but __init__ is what
      # every event's sdk_version field reports at runtime, so a drift
      # would publish telemetry claiming a version nobody released.
      - name: SDK version consistency
        run: python3 tools/check_sdk_versions.py
      - name: SDK version consistency (tests)
        run: python3 tools/test_check_sdk_versions.py
      # The check itself needs mesedi-web beside this repo, so it runs in
      # mesedi-web's tier-drift workflow; its tests run here.
      - name: Dashboard failure-class tiers (tests)
        run: python3 tools/test_check_dashboard_failure_classes.py
      # The gate itself runs with the integration suite; its file and
      # class readers are tested here (added 2026-11-16).
      - name: Detector coverage gate (tests)
        run: python3 tools/test_check_detector_test_coverage.py
      - name: Install SDK + test deps
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # anthropic + openai are NOT runtime dependencies of the SDK
          # (provider instrumentation is import-on-use). They are
          # installed here on purpose: tests/test_mapping_staleness.py
          # walks the real provider exception hierarchies to catch
          # drift between our error maps and the shipped SDKs, and it
          # SKIPS when the package is absent. Without these two lines
          # the drift guard passes vacuously in CI.
          #
          # PINNED DELIBERATELY. Unpinned, CI resolves to whatever the
          # provider shipped that morning, so OpenAI or Anthropic
          # adding one exception class turns this build red with no
          # commit from us — a bad failure mode in general and a very
          # bad one during a launch week. Bumping these is a normal
          # reviewed change: raise the pin, run the suite, map whatever
          # new exception classes the coverage guard reports.
          pip install 'anthropic==0.125.0' 'openai==3.3.1'
      - name: pytest
        working-directory: sdk-python
        run: python -m pytest -q

  sdk-typescript:
    name: sdk-typescript (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      # Overrides must be floors, and none may hold a high or critical
      # advisory. Until 2026-11-16 they were exact versions ("hono":
      # "4.13.7"), which routine updates cannot move, so the pins written
      # to stop alerts became the vulnerable versions. The script's header
      # has the history; its own tests run first so a broken check cannot
      # pass silently. Reads the lockfile, so it runs before the install.
      - name: npm override check (tests)
        run: python3 tools/test_check_npm_pins.py
      - name: npm override check
        run: python3 tools/check_npm_pins.py sdk-typescript
      - name: Install
        working-directory: sdk-typescript
        run: npm ci
      - name: tsc build
        working-directory: sdk-typescript
        run: npm run build
      - name: vitest (unit only)
        working-directory: sdk-typescript
        # *.integration.test.ts drive real Anthropic traffic and need
        # ANTHROPIC_API_KEY + a live backend. They cost money per run
        # and are a manual harness, not CI.
        run: npx vitest run --exclude '**/*.integration.test.ts'
