# Release workflow for the mesedi-curl wrapper.
#
# Triggers on a `mesedi-curl-v*` git tag push (monorepo convention so
# the three publishable artifacts in this repo, sdk-python, sdk-typescript,
# and mesedi-curl, can release independently). Verifies the build,
# validates the distributions with twine, then publishes to PyPI via
# Trusted Publishing (OIDC), no PYPI_TOKEN secret required.
#
# To cut a new release:
#
#   $EDITOR tools/mesedi-curl/pyproject.toml        # bump version
#   $EDITOR tools/mesedi-curl/mesedi_curl/version.py # keep in sync
#   git add tools/mesedi-curl/
#   git commit -m "Release mesedi-curl v0.1.1"
#   git tag -a mesedi-curl-v0.1.1 -m "Release mesedi-curl v0.1.1"
#   git push origin main mesedi-curl-v0.1.1
#
# Consumers update via:
#
#   pip install --upgrade mesedi-curl
#
# Trusted Publishing prerequisite (one-time setup on pypi.org):
#   1. Log in at https://pypi.org/manage/account/publishing/
#   2. Add a new Trusted Publisher for the `mesedi-curl` package with:
#         Owner:            mesedi-ai
#         Repository:       mesedi
#         Workflow name:    release-mesedi-curl.yml
#         Environment:      pypi
#   3. For the initial publish, PyPI requires the project to exist.
#      Use the "pending publisher" flow: register the publisher on the
#      packaging page BEFORE the first release, and PyPI will create
#      the project on first successful upload from this workflow.

name: Release mesedi-curl

on:
  push:
    tags:
      - "mesedi-curl-v*"

permissions:
  contents: write    # GitHub Release creation
  id-token: write    # PyPI Trusted Publishing OIDC token

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mesedi-curl
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify tag matches pyproject.toml version
        working-directory: tools/mesedi-curl
        run: |
          tag="${GITHUB_REF##*/}"                          # mesedi-curl-v0.1.0
          tag_version="${tag#mesedi-curl-v}"               # 0.1.0
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $tag (=> $tag_version) does not match pyproject.toml version $pkg_version"
            exit 1
          fi
          # Also verify version.py matches, since two files hold the
          # version string and they can drift.
          mod_version=$(python -c "import sys; sys.path.insert(0,'.'); from mesedi_curl.version import __version__; print(__version__)")
          if [ "$tag_version" != "$mod_version" ]; then
            echo "::error::tag $tag (=> $tag_version) does not match mesedi_curl/version.py __version__ $mod_version"
            exit 1
          fi

      - name: Build sdist + wheel
        working-directory: tools/mesedi-curl
        run: python -m build

      - name: Validate distributions
        working-directory: tools/mesedi-curl
        run: twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tools/mesedi-curl/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
