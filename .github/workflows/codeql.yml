# CodeQL static analysis for the Mesedi backend (#204).
#
# Scans every push to main and every PR for security issues +
# common quality bugs in the Go codebase. Results land in the
# GitHub Security tab under "Code scanning alerts." On a public
# repo this is free; on a private repo it requires GitHub Advanced
# Security (paid plan).
#
# Schedule: also runs once a week on Sunday at 01:30 UTC so a
# stale main branch doesn't accumulate undetected CVEs between
# pushes.
#
# Permissions: minimum needed for CodeQL to upload SARIF results.
# `security-events: write` is what lets the workflow publish into
# the Security tab; `contents: read` lets it check out source;
# `actions: read` lets it read workflow metadata.

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ "go" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality bundles the security suite plus
          # quality checks (unused values, type confusion, etc).
          # security-extended adds more security rules; we use the
          # broader bundle so quality wins land in PR comments too.
          queries: security-and-quality

      - name: Build (Go)
        # CodeQL needs the codebase compiled to analyze Go. The
        # autobuilder works for most projects but our module lives
        # under backend/ so we point at it explicitly.
        working-directory: backend
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
